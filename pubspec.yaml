name: moreala
description: Spatial study app using the Method of Loci — Phase 1.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  path_provider: ^2.1.3
  http: ^1.2.1
  camera: ^0.11.0                # live walkthrough video capture
  image: ^4.2.0                  # client-side resize/compress before R2 upload
  record: ^6.2.1                 # audio note recording
  audioplayers: ^6.1.0            # audio note playback

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
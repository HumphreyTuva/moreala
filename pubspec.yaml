name: moreala
description: Spatial study app using the Method of Loci — Phase 1.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  path_provider: ^2.1.3
  http: ^1.2.1
  camera: ^0.11.0
  video_thumbnail: ^0.5.3        # on-device frame extraction (no ffmpeg, no server needed)
  video_player: ^2.9.1             # only used briefly to read the recorded video's duration
  image: ^4.2.0                  # client-side resize/compress before R2 upload
  record: ^6.2.1                 # audio note recording
  audioplayers: ^6.1.0            # audio note playback
  collection: ^1.18.0             # used for .firstOrNull in walkthrough branch/neighbor lookups

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0C223A"        # sampled from the icon's own dark navy background
  adaptive_icon_foreground: "assets/icon/app_icon.png"  # use the full app icon artwork so it fills the launcher without extra white padding

flutter:
  uses-material-design: true